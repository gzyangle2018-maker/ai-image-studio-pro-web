name = "ai-image-studio-pro-web"
compatibility_date = "2024-05-12"

# Pages Functions 配置
[site]
bucket = "./dist"

# D1 数据库
[[d1_databases]]
binding = "DB"
database_name = "ai-studio-db"
database_id = "ee15f3d6-3d80-4e80-af2b-b22f1c4e8c91"

# R2 存储桶
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "ai-studio-assets"

# 环境变量（生产环境在 Cloudflare Dashboard 设置，本地用 .dev.vars）
[vars]
ENVIRONMENT = "production"

# 密钥（不要在代码中暴露，通过 Cloudflare Dashboard 设置）
# [env.production.vars]
# JWT_SECRET = "your-jwt-secret"
# OPENAI_API_KEY = "sk-..."
# GEMINI_API_KEY = "..."
# NANO_BANANA_API_KEY = "..."
